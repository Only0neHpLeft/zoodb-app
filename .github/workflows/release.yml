name: Release

on:
  push:
    tags:
      - 'v*'

# Cancel in-progress runs for the same tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  # Fast validation job - fails quickly if secrets are missing
  validate-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate signing secrets
        run: |
          missing=""
          if [ -z "$APPLE_CERTIFICATE" ]; then missing="$missing APPLE_CERTIFICATE"; fi
          if [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then missing="$missing APPLE_CERTIFICATE_PASSWORD"; fi
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then missing="$missing APPLE_SIGNING_IDENTITY"; fi
          if [ -z "$APPLE_ID" ]; then missing="$missing APPLE_ID"; fi
          if [ -z "$APPLE_PASSWORD" ]; then missing="$missing APPLE_PASSWORD"; fi
          if [ -z "$APPLE_TEAM_ID" ]; then missing="$missing APPLE_TEAM_ID"; fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then missing="$missing TAURI_SIGNING_PRIVATE_KEY"; fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then missing="$missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
          echo "All signing secrets are configured"
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

  create-release:
    needs: validate-secrets
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get-version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.get-version.outputs.version }}';
            const body = [
              '![Release](https://img.shields.io/badge/Release-v' + version + '-blue?style=for-the-badge)',
              '![macOS](https://img.shields.io/badge/macOS-Signed%20%26%20Notarized-success?style=flat-square)',
              '![Windows](https://img.shields.io/badge/Windows-x64-blue?style=flat-square)',
              '',
              '## Installation',
              '',
              '| Platform | Architecture | Download |',
              '|:---------|:-------------|:---------|',
              '| macOS | Apple Silicon (M1\u2013M5) | `ZooDB-v' + version + '-arm64.dmg` |',
              '| Windows | x64 | `ZooDB-v' + version + '-x64-setup.exe` |',
              '',
              '---',
              '',
              '## Changelog',
              '',
              'View the [commit history](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/commits/v' + version + ') for detailed changes.',
              '',
              '---',
              '',
              '## Verification',
              '',
              '```',
              'macOS: Signed with Developer ID, notarized by Apple',
              'Windows: Standard installer',
              '```'
            ].join('\n');

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: 'v' + version,
              name: 'ZooDB v' + version,
              body: body,
              draft: true,
              prerelease: false
            })
            return data.id

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - platform: macos-latest
            args: '--target aarch64-apple-darwin --verbose'
            target: aarch64-apple-darwin
            os_type: macos
          # macOS Intel (disabled during development)
          # - platform: macos-latest
          #   args: '--target x86_64-apple-darwin --verbose'
          #   target: x86_64-apple-darwin
          #   os_type: macos
          # Windows x64
          - platform: windows-latest
            args: '--verbose'
            target: x86_64-pc-windows-msvc
            os_type: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: v3-${{ matrix.target || 'default' }}
          cache-on-failure: true
          save-if: true

      - name: Cache Bun dependencies
        id: cache-bun
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: v3-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            v3-${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Sync version from tag
        run: bun run version:sync

      - name: Build frontend
        run: bun run build

      - name: Build and sign Tauri app
        uses: tauri-apps/tauri-action@v0.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_CONVEX_URL: https://necessary-dog-518.convex.cloud
          VITE_CONVEX_SITE_URL: https://necessary-dog-518.convex.site
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: v__VERSION__
          args: ${{ matrix.args }}

      # ── macOS: Sign updater bundle + upload platform-specific JSON ──
      - name: Sign updater bundle (macOS)
        if: matrix.os_type == 'macos'
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"

          TARGZ=$(find src-tauri/target -name "*.app.tar.gz" -not -name "*.sig" -type f | head -1)
          if [ -z "$TARGZ" ]; then
            echo "::error::No .app.tar.gz found"
            exit 1
          fi
          echo "Found tar.gz: $TARGZ"

          bunx tauri signer sign -k "$TAURI_SIGNING_PRIVATE_KEY" -p "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$TARGZ"
          SIG_CONTENT=$(cat "${TARGZ}.sig")
          echo "Signature generated (${#SIG_CONTENT} chars)"

          case "${{ matrix.target }}" in
            aarch64-apple-darwin)
              ASSET_NAME="ZooDB_aarch64.app.tar.gz"
              PLATFORM="darwin-aarch64"
              ;;
            x86_64-apple-darwin)
              ASSET_NAME="ZooDB_x86_64.app.tar.gz"
              PLATFORM="darwin-x86_64"
              ;;
          esac

          DOWNLOAD_URL="https://github.com/Only0neHpLeft/zoodb-app/releases/download/v${VERSION}/${ASSET_NAME}"

          # Upload platform-specific JSON (merged later)
          jq -n \
            --arg platform "$PLATFORM" \
            --arg sig "$SIG_CONTENT" \
            --arg url "$DOWNLOAD_URL" \
            '{($platform): {signature: $sig, url: $url}}' > "updater-${PLATFORM}.json"

          RELEASE_ID="${{ needs.create-release.outputs.release_id }}"
          gh api \
            -H "Content-Type: application/json" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=updater-${PLATFORM}.json" \
            --input "updater-${PLATFORM}.json"
          echo "Uploaded updater-${PLATFORM}.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ── Windows: Sign updater bundle + upload platform-specific JSON ──
      - name: Sign updater bundle (Windows)
        if: matrix.os_type == 'windows'
        shell: pwsh
        run: |
          $VERSION = "${{ needs.create-release.outputs.version }}"

          $NSIS_ZIP = Get-ChildItem -Path src-tauri/target -Recurse -Filter "*.nsis.zip" | Select-Object -First 1
          if (-not $NSIS_ZIP) {
            Write-Error "No .nsis.zip found"
            exit 1
          }
          Write-Host "Found nsis.zip: $($NSIS_ZIP.FullName)"

          bunx tauri signer sign -k "$env:TAURI_SIGNING_PRIVATE_KEY" -p "$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD" "$($NSIS_ZIP.FullName)"
          $SIG_CONTENT = (Get-Content "$($NSIS_ZIP.FullName).sig" -Raw).Trim()
          Write-Host "Signature generated ($($SIG_CONTENT.Length) chars)"

          $ASSET_NAME = "ZooDB_x64-setup.nsis.zip"
          $PLATFORM = "windows-x86_64"
          $DOWNLOAD_URL = "https://github.com/Only0neHpLeft/zoodb-app/releases/download/v${VERSION}/${ASSET_NAME}"

          # Create platform-specific JSON
          $json = @{ $PLATFORM = @{ signature = $SIG_CONTENT; url = $DOWNLOAD_URL } } | ConvertTo-Json -Depth 3
          $json | Out-File -FilePath "updater-${PLATFORM}.json" -Encoding utf8

          $RELEASE_ID = "${{ needs.create-release.outputs.release_id }}"
          gh api `
            -H "Content-Type: application/json" `
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=updater-${PLATFORM}.json" `
            --input "updater-${PLATFORM}.json"
          Write-Host "Uploaded updater-${PLATFORM}.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ── macOS: Notarize ──
      - name: Notarize app
        if: matrix.os_type == 'macos'
        run: |
          DMG_PATH=$(find src-tauri/target -name "*.dmg" -type f | head -1)
          if [ -z "$DMG_PATH" ]; then
            echo "::error::No DMG file found!"
            exit 1
          fi

          echo "Found DMG: $DMG_PATH"
          echo "Submitting to Apple notary service..."

          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --verbose

          echo "Notarization complete!"
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Staple notarization ticket
        if: matrix.os_type == 'macos'
        run: |
          DMG_PATH=$(find src-tauri/target -name "*.dmg" -type f | head -1)
          if [ -n "$DMG_PATH" ]; then
            xcrun stapler staple "$DMG_PATH"
            echo "Stapled ticket to DMG"
          fi

          APP_PATH=$(find src-tauri/target -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            xcrun stapler staple "$APP_PATH"
            echo "Stapled ticket to .app"
          fi

      # ── macOS: Upload notarized DMG ──
      - name: Upload notarized DMG to release
        if: matrix.os_type == 'macos'
        run: |
          DMG_PATH=$(find src-tauri/target -name "*.dmg" -type f | head -1)
          OLD_NAME=$(basename "$DMG_PATH")
          VERSION="${{ needs.create-release.outputs.version }}"

          case "${{ matrix.target }}" in
            aarch64-apple-darwin) ARCH="arm64" ;;
            x86_64-apple-darwin)  ARCH="x64" ;;
            *)                    ARCH="${{ matrix.target }}" ;;
          esac

          NEW_NAME="ZooDB-v${VERSION}-${ARCH}.dmg"
          NEW_PATH="$(dirname "$DMG_PATH")/$NEW_NAME"
          mv "$DMG_PATH" "$NEW_PATH"

          echo "Uploading $NEW_NAME (was $OLD_NAME)..."

          RELEASE_ID="${{ needs.create-release.outputs.release_id }}"
          EXISTING=$(gh api "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" --jq ".[] | select(.name == \"$OLD_NAME\") | .id" 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/${EXISTING}"
          fi
          gh api \
            -H "Content-Type: application/octet-stream" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${NEW_NAME}" \
            --input "$NEW_PATH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── Windows: Rename and upload setup exe ──
      - name: Upload Windows installer to release
        if: matrix.os_type == 'windows'
        shell: pwsh
        run: |
          $VERSION = "${{ needs.create-release.outputs.version }}"
          $RELEASE_ID = "${{ needs.create-release.outputs.release_id }}"

          $SETUP_EXE = Get-ChildItem -Path src-tauri/target -Recurse -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $SETUP_EXE) {
            Write-Host "::warning::No setup exe found, tauri-action may have uploaded it already"
            exit 0
          }

          $OLD_NAME = $SETUP_EXE.Name
          $NEW_NAME = "ZooDB-v${VERSION}-x64-setup.exe"
          $NEW_PATH = Join-Path $SETUP_EXE.DirectoryName $NEW_NAME
          Move-Item $SETUP_EXE.FullName $NEW_PATH

          Write-Host "Uploading $NEW_NAME (was $OLD_NAME)..."

          $existing = gh api "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" --jq ".[] | select(.name == `"$OLD_NAME`") | .id" 2>$null
          if ($existing) {
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/${existing}"
          }

          gh api `
            -H "Content-Type: application/octet-stream" `
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=${NEW_NAME}" `
            --input "$NEW_PATH"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── macOS: Verify signature ──
      - name: Verify code signature and notarization
        if: matrix.os_type == 'macos'
        run: |
          APP_PATH=$(find src-tauri/target -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::warning::No .app bundle found to verify"
            exit 0
          fi

          echo "=== Code Signature Verification ==="
          codesign -vvv --deep --strict "$APP_PATH" 2>&1 || {
            echo "::error::Code signature verification failed"
            exit 1
          }
          echo "Code signature valid"

          echo "=== Notarization Verification ==="
          spctl -a -vvv "$APP_PATH" 2>&1 || {
            echo "::warning::spctl assessment returned non-zero (may be expected in CI)"
          }

          echo "=== Signature Details ==="
          codesign -dvv "$APP_PATH" 2>&1 | grep -E "(Authority|TeamIdentifier|Signature)" || true

  # ── Merge all platform updater JSONs into latest.json ──
  merge-updater-json:
    needs: [create-release, build-tauri]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Merge platform updater files into latest.json
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          RELEASE_ID="${{ needs.create-release.outputs.release_id }}"

          # Download all updater-*.json assets
          ASSETS=$(gh api "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
            --jq '.[] | select(.name | startswith("updater-")) | "\(.id) \(.name)"')

          if [ -z "$ASSETS" ]; then
            echo "::warning::No updater JSON files found"
            exit 0
          fi

          # Download each platform file and merge platforms
          PLATFORMS="{}"
          while IFS=' ' read -r asset_id asset_name; do
            echo "Downloading $asset_name (id: $asset_id)..."
            gh api "repos/${{ github.repository }}/releases/assets/${asset_id}" \
              -H "Accept: application/octet-stream" > "$asset_name"
            cat "$asset_name"

            # Merge this platform's data into the combined object
            PLATFORMS=$(echo "$PLATFORMS" | jq --slurpfile new "$asset_name" '. * $new[0]')

            # Clean up the temp asset from the release
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/${asset_id}"
            echo "Deleted temp asset $asset_name"
          done <<< "$ASSETS"

          echo "Merged platforms:"
          echo "$PLATFORMS" | jq .

          # Build final latest.json
          jq -n \
            --arg version "$VERSION" \
            --arg notes "[CRITICAL] See https://github.com/Only0neHpLeft/zoodb-app/releases/tag/v${VERSION}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson platforms "$PLATFORMS" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: $platforms
            }' > latest.json

          echo "Final latest.json:"
          cat latest.json

          # Delete any existing latest.json on the release
          EXISTING=$(gh api "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
            --jq '.[] | select(.name == "latest.json") | .id' 2>/dev/null || true)
          if [ -n "$EXISTING" ]; then
            gh api -X DELETE "repos/${{ github.repository }}/releases/assets/${EXISTING}"
          fi

          # Upload merged latest.json
          gh api \
            -H "Content-Type: application/json" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/${RELEASE_ID}/assets?name=latest.json" \
            --input latest.json
          echo "Uploaded merged latest.json with all platforms"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    needs: [create-release, build-tauri, merge-updater-json]
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });
