<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c0a1a"/>
      <stop offset="100%" stop-color="#110e22"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="0.5" cy="0.45" r="0.5">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <!-- Crystal face gradients (from icon-concept) -->
    <linearGradient id="faceA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="faceB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <linearGradient id="faceC" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6d28d9"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="faceD" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="vein" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <!-- Arrow gradient -->
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#c4b5fd" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0.5"/>
    </linearGradient>
    <!-- Filters -->
    <filter id="oreGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="veinGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="labelBlur" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>
  <rect width="800" height="500" fill="url(#centerGlow)"/>

  <!-- Rocky ground base -->
  <g>
    <!-- Main rock body -->
    <polygon points="0,500 0,420 30,415 70,425 110,410 150,422 190,408 230,418 270,412 310,425 350,410 390,420 430,408 470,418 510,412 550,422 590,408 630,420 670,414 710,425 750,410 800,418 800,500" fill="#1e1a35"/>
    <!-- Top rock surface -->
    <polygon points="0,420 30,415 70,425 110,410 150,422 190,408 230,418 270,412 310,425 350,410 390,420 430,408 470,418 510,412 550,422 590,408 630,420 670,414 710,425 750,410 800,418 800,420 0,420" fill="#2a2545"/>
    <!-- Rock crack lines -->
    <g stroke="#3d3660" stroke-width="1.5" opacity="0.4" fill="none" stroke-linecap="round">
      <path d="M 60,430 L 100,438 L 140,432"/>
      <path d="M 250,435 L 300,440 L 340,434"/>
      <path d="M 460,432 L 510,438 L 550,434"/>
      <path d="M 650,430 L 700,436 L 740,432"/>
    </g>
    <!-- Darker crevice lines -->
    <g stroke="#14112a" stroke-width="1" opacity="0.5" fill="none" stroke-linecap="round">
      <path d="M 120,440 L 170,445 L 210,440"/>
      <path d="M 370,438 L 420,443 L 460,438"/>
      <path d="M 580,440 L 630,445 L 670,440"/>
    </g>
    <!-- Rock facet texture -->
    <g opacity="0.2">
      <polygon points="80,430 100,426 108,435 90,438" fill="#4a4370"/>
      <polygon points="200,432 218,428 224,436 208,440" fill="#4a4370"/>
      <polygon points="350,428 370,424 376,434 358,436" fill="#3d3660"/>
      <polygon points="500,430 520,426 526,436 508,438" fill="#4a4370"/>
      <polygon points="680,428 698,424 704,434 686,436" fill="#3d3660"/>
    </g>
    <!-- Ore specks in rock -->
    <g opacity="0.3">
      <polygon points="140,435 146,430 150,438 144,440" fill="#7c3aed"/>
      <polygon points="330,432 336,428 340,435 334,438" fill="#8b5cf6"/>
      <polygon points="540,434 546,430 550,437 544,440" fill="#6d28d9"/>
      <polygon points="720,432 726,428 730,436 724,438" fill="#7c3aed"/>
    </g>
    <!-- Subtle top edge highlight -->
    <g stroke="#4a4580" stroke-width="1" opacity="0.25" fill="none" stroke-linejoin="round">
      <polyline points="0,420 30,415 70,425 110,410 150,422 190,408 230,418 270,412 310,425 350,410 390,420 430,408 470,418 510,412 550,422 590,408 630,420 670,414 710,425 750,410 800,418"/>
    </g>
  </g>

  <!-- === LEFT CRYSTAL CLUSTER (near app icon zone ~230,220) === -->

  <!-- Left crystal - medium, leaning left -->
  <g transform="translate(80, 380) rotate(-18)" filter="url(#oreGlow)">
    <polygon points="-12,-100 -28,0 -8,30 8,-5" fill="url(#faceC)" opacity="0.8"/>
    <polygon points="8,-5 -8,30 8,45 22,15" fill="url(#faceB)" opacity="0.8"/>
    <polygon points="8,-5 22,15 30,-15 20,-80" fill="url(#faceA)" opacity="0.8"/>
    <polygon points="-12,-100 5,-112 20,-80 8,-5" fill="url(#faceD)" opacity="0.75"/>
    <polygon points="-12,-100 5,-112 20,-80" fill="#c4b5fd" opacity="0.7"/>
    <g stroke="#c4b5fd" stroke-width="1" opacity="0.3" fill="none">
      <line x1="-12" y1="-100" x2="5" y2="-112"/>
      <line x1="5" y1="-112" x2="20" y2="-80"/>
      <line x1="-12" y1="-100" x2="-28" y2="0"/>
      <line x1="20" y1="-80" x2="30" y2="-15"/>
      <line x1="8" y1="-5" x2="22" y2="15"/>
      <line x1="8" y1="-5" x2="-8" y2="30"/>
    </g>
    <line x1="5" y1="-112" x2="20" y2="-80" stroke="#e9d5ff" stroke-width="1.5" opacity="0.4"/>
    <g filter="url(#veinGlow)">
      <path d="M 2,-65 L -4,-30 L 3,5" stroke="url(#vein)" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.4"/>
    </g>
    <circle cx="-4" cy="-30" r="3" fill="#e9d5ff" opacity="0.35"/>
  </g>

  <!-- Left crystal - small shard -->
  <g transform="translate(55, 400) rotate(-30)" filter="url(#oreGlow)">
    <polygon points="-8,-55 -18,0 -3,18 6,-5" fill="url(#faceB)" opacity="0.65"/>
    <polygon points="6,-5 -3,18 8,12 14,-35" fill="url(#faceA)" opacity="0.65"/>
    <polygon points="-8,-55 3,-60 14,-35 6,-5" fill="url(#faceD)" opacity="0.6"/>
    <polygon points="-8,-55 3,-60 14,-35" fill="#c4b5fd" opacity="0.5"/>
    <g stroke="#a78bfa" stroke-width="0.8" opacity="0.25" fill="none">
      <line x1="-8" y1="-55" x2="3" y2="-60"/>
      <line x1="3" y1="-60" x2="14" y2="-35"/>
      <line x1="-8" y1="-55" x2="-18" y2="0"/>
    </g>
  </g>

  <!-- === RIGHT CRYSTAL CLUSTER (near Applications zone ~570,220) === -->

  <!-- Right crystal - medium, leaning right -->
  <g transform="translate(720, 375) rotate(15)" filter="url(#oreGlow)">
    <polygon points="-15,-110 -32,-5 -10,35 10,-8" fill="url(#faceC)" opacity="0.8"/>
    <polygon points="10,-8 -10,35 12,50 28,18" fill="url(#faceB)" opacity="0.8"/>
    <polygon points="10,-8 28,18 36,-18 25,-88" fill="url(#faceA)" opacity="0.8"/>
    <polygon points="-15,-110 8,-124 25,-88 10,-8" fill="url(#faceD)" opacity="0.75"/>
    <polygon points="-15,-110 8,-124 25,-88" fill="#ddd6fe" opacity="0.7"/>
    <g stroke="#e9d5ff" stroke-width="1" opacity="0.3" fill="none">
      <line x1="-15" y1="-110" x2="8" y2="-124"/>
      <line x1="8" y1="-124" x2="25" y2="-88"/>
      <line x1="-15" y1="-110" x2="-32" y2="-5"/>
      <line x1="25" y1="-88" x2="36" y2="-18"/>
      <line x1="10" y1="-8" x2="28" y2="18"/>
      <line x1="10" y1="-8" x2="-10" y2="35"/>
    </g>
    <line x1="8" y1="-124" x2="25" y2="-88" stroke="#f5f0ff" stroke-width="1.5" opacity="0.45"/>
    <g filter="url(#veinGlow)">
      <path d="M 3,-72 L -5,-35 L 5,5" stroke="url(#vein)" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.45"/>
      <path d="M -5,-35 L -18,-18" stroke="url(#vein)" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.3"/>
    </g>
    <circle cx="-5" cy="-35" r="3.5" fill="#e9d5ff" opacity="0.4"/>
    <circle cx="-5" cy="-35" r="1.5" fill="#f5f0ff" opacity="0.6"/>
    <!-- Tip sparkle -->
    <g transform="translate(8, -124)" opacity="0.3">
      <line x1="0" y1="-6" x2="0" y2="6" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-6" y1="0" x2="6" y2="0" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Right crystal - small shard -->
  <g transform="translate(750, 395) rotate(28)" filter="url(#oreGlow)">
    <polygon points="-7,-50 -16,0 -2,15 5,-5" fill="url(#faceC)" opacity="0.6"/>
    <polygon points="5,-5 -2,15 7,10 12,-32" fill="url(#faceA)" opacity="0.6"/>
    <polygon points="-7,-50 3,-55 12,-32 5,-5" fill="url(#faceD)" opacity="0.55"/>
    <polygon points="-7,-50 3,-55 12,-32" fill="#c4b5fd" opacity="0.45"/>
    <g stroke="#a78bfa" stroke-width="0.8" opacity="0.25" fill="none">
      <line x1="-7" y1="-50" x2="3" y2="-55"/>
      <line x1="3" y1="-55" x2="12" y2="-32"/>
      <line x1="-7" y1="-50" x2="-16" y2="0"/>
    </g>
  </g>

  <!-- === SMALL ACCENT CRYSTALS (scattered) === -->

  <!-- Top-left tiny shard -->
  <g transform="translate(130, 395) rotate(-10)" filter="url(#oreGlow)">
    <polygon points="-5,-38 -12,0 -1,12 4,-3" fill="url(#faceA)" opacity="0.5"/>
    <polygon points="4,-3 -1,12 7,8 10,-24" fill="url(#faceD)" opacity="0.45"/>
    <polygon points="-5,-38 3,-42 10,-24 4,-3" fill="#c4b5fd" opacity="0.4"/>
  </g>

  <!-- Center-bottom tiny shard -->
  <g transform="translate(400, 402) rotate(5)" filter="url(#oreGlow)">
    <polygon points="-6,-42 -14,0 -2,14 5,-4" fill="url(#faceB)" opacity="0.5"/>
    <polygon points="5,-4 -2,14 8,10 12,-28" fill="url(#faceA)" opacity="0.5"/>
    <polygon points="-6,-42 4,-46 12,-28 5,-4" fill="url(#faceD)" opacity="0.45"/>
    <polygon points="-6,-42 4,-46 12,-28" fill="#c4b5fd" opacity="0.35"/>
    <g stroke="#a78bfa" stroke-width="0.8" opacity="0.2" fill="none">
      <line x1="-6" y1="-42" x2="4" y2="-46"/>
      <line x1="4" y1="-46" x2="12" y2="-28"/>
    </g>
    <path d="M 0,-25 L 2,-8" stroke="#c084fc" stroke-width="1.2" fill="none" stroke-linecap="round" opacity="0.3"/>
  </g>

  <!-- Far right tiny shard -->
  <g transform="translate(680, 400) rotate(20)" filter="url(#oreGlow)">
    <polygon points="-4,-32 -10,0 -1,10 4,-3" fill="url(#faceC)" opacity="0.45"/>
    <polygon points="4,-3 -1,10 6,7 8,-20" fill="url(#faceA)" opacity="0.45"/>
    <polygon points="-4,-32 2,-35 8,-20 4,-3" fill="#c4b5fd" opacity="0.35"/>
  </g>

  <!-- === GLOWING VEIN CRACKS on the rock ground === -->
  <g filter="url(#veinGlow)">
    <g stroke="url(#vein)" fill="none" stroke-linecap="round" opacity="0.2">
      <path d="M 90,425 L 120,430 L 150,425 L 170,432" stroke-width="1.5"/>
      <path d="M 300,420 L 330,428 L 360,422" stroke-width="1"/>
      <path d="M 480,425 L 510,430 L 540,425" stroke-width="1"/>
      <path d="M 640,420 L 670,428 L 700,422" stroke-width="1.5"/>
    </g>
  </g>

  <!-- === AMBIENT GLOW SPOTS === -->
  <g opacity="0.05" filter="url(#softGlow)">
    <circle cx="230" cy="230" r="50" fill="#7c3aed"/>
    <circle cx="570" cy="230" r="50" fill="#7c3aed"/>
    <circle cx="400" cy="280" r="35" fill="#7c3aed"/>
  </g>

  <!-- === SPARKLE PARTICLES === -->
  <g opacity="0.2">
    <!-- Cross sparkles -->
    <g transform="translate(160, 120)">
      <line x1="0" y1="-6" x2="0" y2="6" stroke="#c4b5fd" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-6" y1="0" x2="6" y2="0" stroke="#c4b5fd" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(640, 110)">
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-5" y1="0" x2="5" y2="0" stroke="#a78bfa" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <g transform="translate(50, 300)">
      <line x1="0" y1="-4" x2="0" y2="4" stroke="#ddd6fe" stroke-width="1" stroke-linecap="round"/>
      <line x1="-4" y1="0" x2="4" y2="0" stroke="#ddd6fe" stroke-width="1" stroke-linecap="round"/>
    </g>
    <g transform="translate(755, 280)">
      <line x1="0" y1="-5" x2="0" y2="5" stroke="#c4b5fd" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-5" y1="0" x2="5" y2="0" stroke="#c4b5fd" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <!-- Floating dots -->
    <circle cx="120" cy="180" r="2" fill="#a78bfa"/>
    <circle cx="300" cy="100" r="1.5" fill="#c4b5fd"/>
    <circle cx="500" cy="90" r="2" fill="#8b5cf6"/>
    <circle cx="690" cy="170" r="1.5" fill="#a78bfa"/>
    <circle cx="350" cy="370" r="1.5" fill="#c4b5fd"/>
    <circle cx="450" cy="150" r="1" fill="#ddd6fe"/>
    <circle cx="40" cy="200" r="1.5" fill="#8b5cf6"/>
    <circle cx="770" cy="380" r="1" fill="#a78bfa"/>
    <circle cx="230" cy="350" r="1" fill="#c4b5fd"/>
    <circle cx="580" cy="360" r="1" fill="#8b5cf6"/>
  </g>

  <!-- === DIRECTIONAL ARROW (app → Applications) === -->
  <g transform="translate(400, 230)">
    <!-- Dashed line -->
    <line x1="-100" y1="0" x2="100" y2="0" stroke="url(#arrowGrad)" stroke-width="2.5" stroke-dasharray="10 7" stroke-linecap="round"/>
    <!-- Arrow head -->
    <polygon points="100,0 86,-9 86,9" fill="#c4b5fd" opacity="0.7"/>
  </g>

  <!-- Icon labels -->
  <text x="230" y="310" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="white" font-weight="400" letter-spacing="0.3">ZooDB</text>
  <text x="570" y="310" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="white" font-weight="400" letter-spacing="0.3">Applications</text>

  <!-- Hint text -->
  <text x="400" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#a78bfa" opacity="0.35" font-weight="300" letter-spacing="0.5">Drag to install</text>
</svg>
