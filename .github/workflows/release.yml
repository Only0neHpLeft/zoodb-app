name: Release

on:
  push:
    tags:
      - 'v*'

# Cancel in-progress runs for the same tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  # Fast validation job - fails quickly if secrets are missing
  validate-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate signing secrets
        run: |
          missing=""
          if [ -z "$APPLE_CERTIFICATE" ]; then missing="$missing APPLE_CERTIFICATE"; fi
          if [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then missing="$missing APPLE_CERTIFICATE_PASSWORD"; fi
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then missing="$missing APPLE_SIGNING_IDENTITY"; fi
          if [ -z "$APPLE_ID" ]; then missing="$missing APPLE_ID"; fi
          if [ -z "$APPLE_PASSWORD" ]; then missing="$missing APPLE_PASSWORD"; fi
          if [ -z "$APPLE_TEAM_ID" ]; then missing="$missing APPLE_TEAM_ID"; fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then missing="$missing TAURI_SIGNING_PRIVATE_KEY"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
          echo "All signing secrets are configured"
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

  create-release:
    needs: validate-secrets
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get-version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.get-version.outputs.version }}';
            const body = [
              '![Release](https://img.shields.io/badge/Release-v' + version + '-blue?style=for-the-badge)',
              '![macOS](https://img.shields.io/badge/macOS-Signed%20%26%20Notarized-success?style=flat-square)',
              '![Windows](https://img.shields.io/badge/Windows-x64-blue?style=flat-square)',
              '',
              '## Installation',
              '',
              '| Platform | Architecture | Download |',
              '|:---------|:-------------|:---------|',
              '| macOS | Apple Silicon (M1–M5) | `ZooDB-v' + version + '-arm64.dmg` |',
              '| Windows | x64 | `ZooDB_' + version + '_x64-setup.exe` |',
              '',
              '---',
              '',
              '## Changelog',
              '',
              'View the [commit history](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/commits/v' + version + ') for detailed changes.',
              '',
              '---',
              '',
              '## Verification',
              '',
              '```',
              'macOS: Signed with Developer ID, notarized by Apple',
              'Windows: Standard installer',
              '```'
            ].join('\n');

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: 'v' + version,
              name: 'ZooDB v' + version,
              body: body,
              draft: true,
              prerelease: false
            })
            return data.id

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - platform: macos-latest
            args: '--target aarch64-apple-darwin --verbose'
            target: aarch64-apple-darwin
            os_type: macos
          # Windows x64 (disabled during testing — mac-only builds)
          # - platform: windows-latest
          #   args: '--verbose'
          #   target: x86_64-pc-windows-msvc
          #   os_type: windows

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          shared-key: v3-${{ matrix.target || 'default' }}
          cache-on-failure: true
          save-if: true

      - name: Cache Bun dependencies
        id: cache-bun
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: v3-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            v3-${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Sync version from tag
        run: bun run version:sync

      # tauri-action builds, signs, notarizes, and uploads artifacts + latest.json
      - name: Build and sign Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_CONVEX_URL: https://intent-robin-412.convex.cloud
          VITE_CONVEX_SITE_URL: https://api.zoodb.app
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: v${{ needs.create-release.outputs.version }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # ── Rename assets via GitHub API (lightweight PATCH, no re-upload) ──
      - name: Rename DMG asset
        if: matrix.os_type == 'macos'
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          RELEASE_ID="${{ needs.create-release.outputs.release_id }}"
          ASSET_ID=$(gh api "repos/${{ github.repository }}/releases/${RELEASE_ID}/assets" \
            --jq '.[] | select(.name | endswith(".dmg")) | .id')
          if [ -n "$ASSET_ID" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/releases/assets/${ASSET_ID}" \
              -f name="ZooDB-v${VERSION}-arm64.dmg"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # NOTE: Do NOT rename the EXE — latest.json references the original
      # Tauri filename (ZooDB_X.X.X_x64-setup.exe) and renaming causes a 404
      # during auto-update downloads.

  publish-release:
    needs: [create-release, build-tauri]
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });
