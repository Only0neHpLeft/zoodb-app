[package]
name = "zoodb-app"
version = "0.0.2"
description = "SQL Learning Platform with Zoo Database"
authors = ["Only0neHpLeft"]
license = ""
repository = "https://github.com/Only0neHpLeft/zoodb-app"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "zoodb_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
tauri = { version = "2.9.5", features = ["devtools"] }
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
tauri-plugin-deep-link = "2"
tauri-plugin-os = "2"

# Updater (desktop only)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "debuginfo"
