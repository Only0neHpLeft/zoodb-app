name: Release

on:
  push:
    tags:
      - 'v*'

# Cancel in-progress runs for the same tag
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10

jobs:
  # Fast validation job - fails quickly if secrets are missing
  validate-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Validate macOS signing secrets
        run: |
          missing=""
          if [ -z "$APPLE_CERTIFICATE" ]; then missing="$missing APPLE_CERTIFICATE"; fi
          if [ -z "$APPLE_CERTIFICATE_PASSWORD" ]; then missing="$missing APPLE_CERTIFICATE_PASSWORD"; fi
          if [ -z "$APPLE_SIGNING_IDENTITY" ]; then missing="$missing APPLE_SIGNING_IDENTITY"; fi
          if [ -z "$APPLE_ID" ]; then missing="$missing APPLE_ID"; fi
          if [ -z "$APPLE_PASSWORD" ]; then missing="$missing APPLE_PASSWORD"; fi
          if [ -z "$APPLE_TEAM_ID" ]; then missing="$missing APPLE_TEAM_ID"; fi
          if [ -n "$missing" ]; then
            echo "::error::Missing required secrets:$missing"
            exit 1
          fi
          echo "✓ All macOS signing secrets are configured"
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  create-release:
    needs: validate-secrets
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: get-version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Create release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.get-version.outputs.version }}';
            const body = [
              '![Release](https://img.shields.io/badge/Release-v' + version + '-blue?style=for-the-badge)',
              '![macOS](https://img.shields.io/badge/macOS-Signed%20%26%20Notarized-success?style=flat-square)',
              '',
              '## Installation',
              '',
              '| Platform | Architecture | Download |',
              '|:---------|:-------------|:---------|',
              '| macOS | Apple Silicon (M1/M2/M3) | `.dmg` |',
              '| macOS | Intel x64 | `.dmg` |',
              '| Windows | x64 | `.msi` / `.exe` |',
              '| Linux | x64 | `.AppImage` / `.deb` |',
              '',
              '---',
              '',
              '## Changelog',
              '',
              'View the [commit history](https://github.com/' + context.repo.owner + '/' + context.repo.repo + '/commits/v' + version + ') for detailed changes.',
              '',
              '---',
              '',
              '## Verification',
              '',
              '```',
              'macOS: Signed with Developer ID, notarized by Apple',
              'Status: Ready to run - no additional steps required',
              '```'
            ].join('\n');

            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: 'v' + version,
              name: 'Zoo Database v' + version,
              body: body,
              draft: true,
              prerelease: false
            })
            return data.id

  build-tauri:
    needs: create-release
    permissions:
      contents: write
    # Timeout includes notarization which can take 1-2 hours
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS Apple Silicon
          - platform: macos-latest
            args: '--target aarch64-apple-darwin --verbose'
            target: aarch64-apple-darwin
          # macOS Intel
          - platform: macos-latest
            args: '--target x86_64-apple-darwin --verbose'
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # Include target in shared-key for better cache hits (Context7 best practice)
          shared-key: v2-${{ matrix.target || 'default' }}
          cache-on-failure: true
          # Save cache even if build fails (for faster retry)
          save-if: true

      - name: Cache Bun dependencies
        id: cache-bun
        uses: actions/cache@v5
        with:
          path: ~/.bun/install/cache
          key: v2-${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            v2-${{ runner.os }}-bun-
            v1-${{ runner.os }}-bun-

      - name: Install frontend dependencies
        # Skip install if cache hit (Context7 optimization)
        if: steps.cache-bun.outputs.cache-hit != 'true'
        run: bun install --frozen-lockfile

      - name: Verify dependencies (cache hit path)
        if: steps.cache-bun.outputs.cache-hit == 'true'
        run: echo "✓ Using cached Bun dependencies"

      - name: Sync version from tag
        run: bun run version:sync

      - name: Cache frontend build
        id: cache-frontend-build
        uses: actions/cache@v5
        with:
          path: dist
          key: v1-${{ runner.os }}-frontend-build-${{ hashFiles('src/**', 'vite.config.ts', 'bun.lock') }}
          restore-keys: |
            v1-${{ runner.os }}-frontend-build-

      - name: Build frontend
        if: steps.cache-frontend-build.outputs.cache-hit != 'true'
        run: bun run build

      - name: Verify frontend build (cache hit)
        if: steps.cache-frontend-build.outputs.cache-hit == 'true'
        run: echo "✓ Using cached frontend build"

      - name: Cache Tauri CLI
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/tauri
          key: v1-${{ runner.os }}-tauri-cli-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            v1-${{ runner.os }}-tauri-cli-

      - name: Build and sign Tauri app (no notarization)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Clerk Auth (publishable key is public, safe to hardcode)
          VITE_CLERK_PUBLISHABLE_KEY: pk_test_dWx0aW1hdGUtcGVnYXN1cy00MS5jbGVyay5hY2NvdW50cy5kZXYk
          # macOS code signing ONLY (no APPLE_ID/PASSWORD/TEAM_ID = skip notarization)
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Windows code signing (uncomment when ready)
          # WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          # WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      - name: Notarize app with verbose output
        run: |
          echo "🔍 Finding DMG file..."
          DMG_PATH=$(find src-tauri/target -name "*.dmg" -type f | head -1)

          if [ -z "$DMG_PATH" ]; then
            echo "::error::No DMG file found!"
            exit 1
          fi

          echo "📦 Found DMG: $DMG_PATH"
          echo "📤 Submitting to Apple notary service..."
          echo ""

          # Submit for notarization with verbose output
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --verbose

          echo ""
          echo "✅ Notarization complete!"
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Staple notarization ticket
        run: |
          echo "📎 Stapling notarization ticket..."

          # Staple to DMG
          DMG_PATH=$(find src-tauri/target -name "*.dmg" -type f | head -1)
          if [ -n "$DMG_PATH" ]; then
            xcrun stapler staple "$DMG_PATH"
            echo "✅ Stapled ticket to DMG"
          fi

          # Staple to .app
          APP_PATH=$(find src-tauri/target -name "*.app" -type d | head -1)
          if [ -n "$APP_PATH" ]; then
            xcrun stapler staple "$APP_PATH"
            echo "✅ Stapled ticket to .app"
          fi

      - name: Upload notarized DMG to release
        run: |
          DMG_PATH=$(find src-tauri/target -name "*.dmg" -type f | head -1)
          DMG_NAME=$(basename "$DMG_PATH")

          echo "📤 Uploading $DMG_NAME to release..."

          gh release upload "v${{ needs.create-release.outputs.version }}" "$DMG_PATH" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify code signature and notarization
        run: |
          echo "🔍 Verifying code signature and notarization..."

          # Find the built .app bundle
          APP_PATH=$(find src-tauri/target -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::warning::No .app bundle found to verify"
            exit 0
          fi

          echo "📦 Found app: $APP_PATH"

          # Verify code signature
          echo ""
          echo "=== Code Signature Verification ==="
          codesign -vvv --deep --strict "$APP_PATH" 2>&1 || {
            echo "::error::Code signature verification failed"
            exit 1
          }
          echo "✅ Code signature valid"

          # Check notarization ticket (stapled)
          echo ""
          echo "=== Notarization Verification ==="
          spctl -a -vvv "$APP_PATH" 2>&1 || {
            echo "::warning::spctl assessment returned non-zero (may be expected in CI)"
          }

          # Verify the signature includes notarization
          echo ""
          echo "=== Signature Details ==="
          codesign -dvv "$APP_PATH" 2>&1 | grep -E "(Authority|TeamIdentifier|Signature)" || true

          echo ""
          echo "✅ Verification complete for ${{ matrix.target }}"

  publish-release:
    needs: [create-release, build-tauri]
    permissions:
      contents: write
    runs-on: ubuntu-latest

    steps:
      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });