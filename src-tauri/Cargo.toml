[package]
name = "zoodb-app"
version = "0.0.1"
description = "SQL Learning Platform with Zoo Database"
authors = ["Only0neHpLeft"]
license = ""
repository = "https://github.com/Only0neHpLeft/zoodb-app"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "zoodb_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
dotenvy = "0.15"                          # Load .env files securely
tauri = { version = "2.9.5", features = [] }
tauri-plugin-log = "2"

tauri-plugin-process = "2"            # Process management
tauri-plugin-opener = "2"             # Open URLs/files
tauri-plugin-store = "2"              # User preferences storage
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }  # Required by Clerk
tauri-plugin-clerk = "0.1"            # Clerk authentication

# Database (PostgreSQL via sqlx)
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "chrono"] }
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }

# Updater (desktop only)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = "debuginfo"
